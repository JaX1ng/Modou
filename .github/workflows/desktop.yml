# 桌面版（Steam 用）自动打包。放到 .github/workflows/desktop.yml。
# 推一个 v 开头的 tag（比如 v2.1.0）→ 三个系统各打一个包 → 自动建 GitHub Release 并附上安装包。
# 也可以在 Actions 页面手动点「Run workflow」，只打包、不发 Release（包在这次运行的 Artifacts 里下载）。
name: desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # Windows 是正式要发的；Linux、macOS 只是顺手打，失败了不影响 Release
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            optional: false
            builder_args: --win --x64
            files: src/desktop/dist/*.zip
          - name: linux
            os: ubuntu-latest
            optional: true
            builder_args: --linux --x64
            files: src/desktop/dist/*.AppImage
          - name: macos
            os: macos-latest
            optional: true
            builder_args: --mac
            files: src/desktop/dist/*.zip
    env:
      PYTHONUTF8: '1'                     # build.py 打印中文，Windows 上不加会报编码错
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # 不找签名证书（还没有）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fontTools
        run: python -m pip install fonttools==4.66.1 brotli==1.2.1

      - name: npm ci
        working-directory: src/desktop
        run: npm ci

      - name: Build game bundle + fonts (build.py --desktop)
        working-directory: src
        run: python build.py --desktop

      - name: Check tag matches VERSION in js/config.js
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: src/desktop
        run: |
          app_version=$(node -p "require('./package.json').version")
          if [ "v$app_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag 是 $GITHUB_REF_NAME，但 js/config.js 的 VERSION 是 $app_version。改成一样再推 tag。"
            exit 1
          fi

      - name: Package (electron-builder)
        working-directory: src/desktop
        run: npx electron-builder ${{ matrix.builder_args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: modou-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    # 只在推 tag 时发。Windows 包必须有（下面会检查）；Linux/macOS 失败了就少附那个文件
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write                     # 建 Release、上传附件要用
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: modou-*
          path: release
          merge-multiple: true

      - name: Windows zip must exist
        run: |
          ls -la release
          ls release/*-win-x64.zip

      - uses: softprops/action-gh-release@v2
        with:
          name: 墨斗 ${{ github.ref_name }}
          files: |
            release/*.zip
            release/*.AppImage
          fail_on_unmatched_files: false
          generate_release_notes: true
